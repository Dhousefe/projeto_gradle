# ===================================================================
# BrProject - Configurações do Starter, Repositórios e Atualizador
# Localização: gradle/starter.properties
# ===================================================================

# -------------------------------------------------------------------
# FASE 1: JDK 25 Autônomo e Ferramentas Gradle
# -------------------------------------------------------------------
# URL para download do JDK 25 caso não exista localmente
repo.jdk.url=https://github.com/adoptium/temurin25-binaries/releases/download/jdk-25.0.4.1%2B1/OpenJDK25U-jdk_x64_windows_hotspot_25.0.4.1_1.zip
repo.jdk.target_dir=gradle/jdk25
repo.jdk.sha256=

# URL do Gradle Wrapper caso ausente
repo.gradle.url=https://github.com/Dhousefe/projeto_gradle/archive/refs/heads/main.zip
repo.gradle.target_dir=gradle

# -------------------------------------------------------------------
# FASE 2: Repositório do Servidor BrProject
# -------------------------------------------------------------------
# Repositório GitHub do Servidor (aceita URL Git ou Release Zip)
repo.server.url=https://github.com/Dhousefe/Brproject_2026/archive/refs/heads/main.zip
repo.server.branch=main
repo.server.target_dir=brproject

# Lista de pastas e arquivos protegidos que o atualizador NUNCA sobrescreve (separados por vírgula)
updater.protected_paths=brproject/game/config/,.env

# -------------------------------------------------------------------
# FASE 3: Arquivos de Geodata
# -------------------------------------------------------------------
repo.geodata.enabled=true
repo.geodata.url=https://github.com/Dhousefe/Geodata_Brproject/archive/refs/heads/main.zip
repo.geodata.target_dir=brproject/game/data/geodata
repo.geodata.sha256=

# -------------------------------------------------------------------
# FASE 4: Compilação do Projeto com Gradle
# -------------------------------------------------------------------
# Opções para compilar: "always", "never", "ask" (pergunta se detectar código modificado ou primeiro start)
build.mode=ask
build.task=build
build.flags=--no-daemon --parallel -x test

# -------------------------------------------------------------------
# FASE 5: Execução do Servidor BrProject
# -------------------------------------------------------------------
server.java_home=gradle/jdk25
server.working_dir=brproject
server.jar=brproject/libs/server.jar
server.main_class=ext.mods.security.LicenseInit
server.jvm_args=-Xms156m -Xmx156m -Dext.mods.Config.dataPath=../brproject/game/data -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=8m
server.auto_restart=false
